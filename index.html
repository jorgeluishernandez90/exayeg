<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Guía de estudio · Concurso público 2026</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">
  <button id="btn-menu-movil" class="btn-menu-movil" aria-label="Abrir menú de temas">☰ &nbsp;Temario</button>
  <div id="fondo-menu-movil" class="fondo-menu-movil"></div>

  <aside class="sidebar" id="sidebar">
    <button class="brand brand-link" id="btn-inicio">Guía YEG</button>
    <span class="brand-sub">Concurso público · Consejerías electorales</span>

    <div class="auth-box" id="auth-box">
      <span class="auth-status" id="auth-status">Estudiando como invitado. Tu avance solo se guarda en este navegador.</span>
      <button class="btn" id="btn-login" style="display:none;">Iniciar sesión con Google</button>
      <button class="btn secundario" id="btn-logout" style="display:none;">Cerrar sesión</button>
    </div>

    <div class="progreso-resumen" id="progreso-resumen">Avance: 0 de 1 lecciones disponibles</div>

    <nav class="temario" id="temario"></nav>
  </aside>

  <main id="main-content"></main>
</div>

<!-- Firebase (opcional). Si no llenas js/firebase-config.js, la app funciona igual usando el navegador. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
